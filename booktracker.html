<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Book Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eee8ff, #fdf8ef);
            min-height: 100vh;
            margin: 0;
            padding: 28px 16px 40px;
            color: #3f3b4d;
        }

        .box { max-width: 1100px; margin: auto; }

        h1 {
            text-align: center;
            color: #63539b;
            font-size: 38px;
            margin: 0 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #817b91;
            margin: 0 0 30px;
        }

        .form, .table-box {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(99, 83, 155, 0.12);
            margin-bottom: 25px;
        }

        .form h2 { margin-top: 0; color: #63539b; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        input, select {
            padding: 12px;
            border: 1px solid #ddd6ed;
            border-radius: 10px;
            background: #faf9ff;
            color: #454052;
            outline: none;
            font-size: 16px;
        }

        input { width: min(220px, 100%); }
        select { width: max-content; min-width: 11.5rem; max-width: 100%; white-space: nowrap; }
        input:focus, select:focus { border-color: #8b79c7; }

        button {
            padding: 11px 17px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            background: #7564b5;
            font-weight: bold;
        }

        button:hover { opacity: 0.92; }
        .edit { background: #70a887; }
        .delete { background: #d96b6b; }
        .export-button { background: #8b79c7; }

        .filter-box {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee9f5;
        }

        .filter-box label { font-weight: bold; color: #63539b; }

        .table-box { padding: 10px; overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; }

        th {
            background: #7564b5;
            color: white;
            padding: 15px;
            cursor: pointer;
            white-space: nowrap;
        }

        th:first-child { border-radius: 12px 0 0 12px; }
        th:last-child { border-radius: 0 12px 12px 0; }

        td {
            padding: 15px 10px;
            text-align: center;
            border-bottom: 1px solid #eeeaf4;
        }

        tr:hover { background: #faf8ff; }

        span.pill {
            padding: 6px 12px !important;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: inline-block;
            width: auto !important;
            height: auto !important;
            line-height: 1.2;
            white-space: nowrap;
        }

        td.status-cell, th.status-col { white-space: nowrap; }

        .want { background: #eee7ff; color: #7057a9; }
        .reading { background: #fff1d8; color: #b47720; }
        .finished { background: #e2f4e8; color: #4c8a62; }

        #pages {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
        }

        #pages button { background: #a394d2; min-width: 40px; width: auto; }
        .empty { text-align: center; padding: 30px; color: #9992a5; }
        .action-buttons { display: inline-flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

        @media (max-width: 720px) {
            body { padding: 16px 12px 28px; }
            h1 { font-size: 28px; }
            .subtitle { font-size: 14px; margin-bottom: 20px; }
            .form { padding: 18px; }
            .controls, .filter-box .controls { display: grid; }
            input, select, .form button, .export-button { width: 100%; min-width: 0; }
            #pages button, .edit, .delete { width: auto; }
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/records.js"></script>
</head>
<body>
    <div id="appRoot" hidden>
        <div class="box">
            <div class="top-bar">
                <a href="index.html" class="btn btn-soft btn-secondary rounded-full px-6 shadow-md">← Back to My Projects 💗</a>
                <div id="sessionSlot"></div>
            </div>

            <h1>♡ My Book Tracker ♡</h1>
            <p class="subtitle">Keep track of all the stories you're reading ✨</p>

            <div class="form">
                <h2>➕ Add a Book</h2>
                <div class="controls">
                    <input id="title" type="text" placeholder="Book title">
                    <input id="author" type="text" placeholder="Author">
                    <select id="status" aria-label="Reading status">
                        <option value="Want to Read">Want&nbsp;to&nbsp;Read</option>
                        <option value="Reading">Reading</option>
                        <option value="Finished">Finished</option>
                    </select>
                    <select id="rating" aria-label="Rating">
                        <option value="0">No Rating</option>
                        <option value="1">⭐</option>
                        <option value="2">⭐⭐</option>
                        <option value="3">⭐⭐⭐</option>
                        <option value="4">⭐⭐⭐⭐</option>
                        <option value="5">⭐⭐⭐⭐⭐</option>
                    </select>
                    <button class="add-button" id="addBook" type="button">Add Book</button>
                </div>

                <div class="filter-box">
                    <div class="controls">
                        <label for="filter">📖 Show:</label>
                        <select id="filter">
                            <option value="All">All Books</option>
                            <option value="Want to Read">Want&nbsp;to&nbsp;Read</option>
                            <option value="Reading">Reading</option>
                            <option value="Finished">Finished</option>
                        </select>
                        <button class="export-button" id="exportCsv" type="button">↓ Export to CSV</button>
                    </div>
                </div>
            </div>

            <div class="table-box">
                <table>
                    <thead>
                        <tr>
                            <th data-sort="title">Title ↕️</th>
                            <th data-sort="author">Author ↕️</th>
                            <th class="status-col" data-sort="status">Status ↕️</th>
                            <th data-sort="rating">Rating ↕️</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="bookList"></tbody>
                </table>
            </div>
            <div id="pages"></div>
        </div>
    </div>

    <script>
        var books = [];
        var currentPage = 1;
        var sortColumn = "title";
        var sortOrder = "ASC";
        var perPage = 20;
        var loaded = false;

        function stars(rating) {
            var count = Number(rating) || 0;
            return count > 0 ? "⭐".repeat(count) : "—";
        }

        function statusClass(status) {
            if (status === "Want to Read") return "want";
            if (status === "Reading") return "reading";
            return "finished";
        }

        function statusLabel(status) {
            return AppAuth.escape(status).replace(/ /g, "&nbsp;");
        }

        function showBooks() {
            var filter = document.getElementById("filter").value;
            var visible = books.filter(function (book) {
                return filter === "All" || book.status === filter;
            });
            visible = Records.sortBy(visible, sortColumn, sortOrder);
            var view = Records.paginate(visible, currentPage, perPage);
            currentPage = view.page || 1;

            var list = document.getElementById("bookList");
            if (!loaded) {
                list.innerHTML = '<tr><td colspan="5" class="empty">Loading your books…</td></tr>';
                return;
            }
            if (view.rows.length === 0) {
                list.innerHTML = '<tr><td colspan="5" class="empty">♡ No books here yet!</td></tr>';
            } else {
                list.innerHTML = view.rows.map(function (book) {
                    return '<tr>' +
                        '<td data-label="Title"><strong>' + AppAuth.escape(book.title) + '</strong></td>' +
                        '<td data-label="Author">' + AppAuth.escape(book.author) + '</td>' +
                        '<td class="status-cell" data-label="Status"><span class="pill ' + statusClass(book.status) + '">' + statusLabel(book.status) + '</span></td>' +
                        '<td data-label="Rating">' + stars(book.rating) + '</td>' +
                        '<td class="actions" data-label="Actions"><span class="action-buttons">' +
                        '<button class="edit" type="button" data-action="edit" data-id="' + AppAuth.escape(book.id) + '">Edit</button>' +
                        '<button class="delete" type="button" data-action="delete" data-id="' + AppAuth.escape(book.id) + '">Delete</button>' +
                        '</span></td></tr>';
                }).join("");
            }

            var pages = document.getElementById("pages");
            pages.innerHTML = "";
            for (var i = 1; i <= view.totalPages; i++) {
                pages.innerHTML += '<button type="button" data-page="' + i + '">' + i + '</button>';
            }
        }

        function addBook() {
            var title = document.getElementById("title").value.trim();
            var author = document.getElementById("author").value.trim();
            var status = document.getElementById("status").value;
            var rating = Number(document.getElementById("rating").value);
            if (!title || !author) {
                alert("Please enter the title and author.");
                return;
            }
            AppAuth.add("books", {
                title: title,
                author: author,
                status: status,
                rating: rating
            }).then(function () {
                document.getElementById("title").value = "";
                document.getElementById("author").value = "";
                document.getElementById("rating").value = "0";
                currentPage = 1;
            }).catch(function (error) {
                AppAuth.showDataError(error);
            });
        }

        function editBook(id) {
            var book = books.find(function (item) { return item.id === id; });
            if (!book) return;
            var title = prompt("Book title:", book.title || "");
            if (title == null) return;
            var author = prompt("Author:", book.author || "");
            if (author == null) return;
            var status = prompt("Status (Want to Read / Reading / Finished):", book.status || "Want to Read");
            if (status == null) return;
            var rating = prompt("Rating from 0 to 5:", book.rating == null ? "0" : book.rating);
            if (rating == null) return;
            AppAuth.update("books", id, {
                title: title.trim(),
                author: author.trim(),
                status: status.trim(),
                rating: Number(rating) || 0
            }).catch(function (error) {
                AppAuth.showDataError(error);
            });
        }

        function deleteBook(id) {
            if (!confirm("Delete this book?")) return;
            AppAuth.remove("books", id).catch(function (error) {
                AppAuth.showDataError(error);
            });
        }

        function exportCsv() {
            if (books.length === 0) {
                alert("There are no books to export!");
                return;
            }
            Records.downloadCsv("my-books.csv", ["Title", "Author", "Status", "Rating"], books.map(function (book) {
                return [book.title, book.author, book.status, book.rating];
            }));
        }

        document.getElementById("addBook").addEventListener("click", addBook);
        document.getElementById("exportCsv").addEventListener("click", exportCsv);
        document.getElementById("filter").addEventListener("change", function () {
            currentPage = 1;
            showBooks();
        });
        document.querySelector("thead").addEventListener("click", function (event) {
            var header = event.target.closest("[data-sort]");
            if (!header) return;
            var column = header.getAttribute("data-sort");
            if (sortColumn === column) {
                sortOrder = sortOrder === "ASC" ? "DESC" : "ASC";
            } else {
                sortColumn = column;
                sortOrder = "ASC";
            }
            currentPage = 1;
            showBooks();
        });
        document.getElementById("bookList").addEventListener("click", function (event) {
            var button = event.target.closest("[data-action]");
            if (!button) return;
            var id = button.getAttribute("data-id");
            if (button.getAttribute("data-action") === "edit") editBook(id);
            if (button.getAttribute("data-action") === "delete") deleteBook(id);
        });
        document.getElementById("pages").addEventListener("click", function (event) {
            var button = event.target.closest("[data-page]");
            if (!button) return;
            currentPage = Number(button.getAttribute("data-page"));
            showBooks();
        });

        AppAuth.start(function () {
            AppAuth.watch("books", function (rows, error) {
                loaded = true;
                AppAuth.showDataError(error);
                books = rows;
                showBooks();
            });
        });
    </script>
</body>
</html>
