<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f3f6ff;
            margin: 0;
            padding: 28px 16px 40px;
            color: #2c3358;
        }
        .box { max-width: 1000px; margin: auto; }
        h1 { color: #4056d6; font-size: 32px; margin: 8px 0 16px; }
        .form, .table-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #d5dcf3;
        }
        .table-box { margin-top: 25px; overflow-x: auto; padding: 10px; }
        .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        input, select, button {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        input { width: min(180px, 100%); }
        button {
            background: #4056d6;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .delete { background: #e74c3c; }
        .edit { background: #27ae60; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #4056d6; color: white; padding: 12px; cursor: pointer; white-space: nowrap; }
        td { padding: 10px; border-bottom: 1px solid #ddd; text-align: center; }
        #pages { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 20px; }
        #pages button { min-width: 40px; width: auto; }
        .empty { text-align: center; color: #7d86a8; padding: 24px; }
        .action-buttons { display: inline-flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
        @media (max-width: 720px) {
            body { padding: 16px 12px 28px; }
            h1 { font-size: 26px; }
            .controls { display: grid; }
            input, select, .form button { width: 100%; }
            .edit, .delete, #pages button { width: auto; }
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/records.js"></script>
</head>
<body>
    <div id="appRoot" hidden>
        <div class="box">
            <div class="top-bar">
                <a href="index.html" class="btn btn-soft btn-secondary rounded-full px-6 shadow-md">← Back to My Projects 💗</a>
                <div id="sessionSlot"></div>
            </div>
            <h1>🎓 Student Manager</h1>
            <div class="form">
                <div class="controls">
                    <input id="studentName" placeholder="Student Name">
                    <input id="studentGrade" type="number" placeholder="Grade">
                    <input id="studentDob" type="date" aria-label="Date of birth">
                    <input id="studentAddress" placeholder="Address">
                    <button id="addStudent" type="button">Add Student</button>
                </div>
                <div class="controls" style="margin-top: 12px;">
                    <select id="gradeFilter" aria-label="Filter by grade">
                        <option value="">All Grades</option>
                    </select>
                    <button id="exportCsv" type="button">📄 Export CSV</button>
                </div>
            </div>
            <div class="table-box">
                <table>
                    <thead>
                        <tr>
                            <th data-sort="rollNo">Roll No. ↕</th>
                            <th data-sort="name">Name ↕</th>
                            <th data-sort="grade">Grade ↕</th>
                            <th data-sort="dob">DOB ↕</th>
                            <th data-sort="address">Address ↕</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentList"></tbody>
                </table>
            </div>
            <div id="pages"></div>
        </div>
    </div>
    <script>
        var students = [];
        var rebuildingFilter = false;
        var page = 1;
        var sortColumn = "rollNo";
        var sortOrder = "ASC";
        var perPage = 20;

        function nextRoll() {
            return students.reduce(function (max, student) {
                return Math.max(max, Number(student.rollNo) || 0);
            }, 0) + 1;
        }

        function makeGradeFilter() {
            rebuildingFilter = true;
            var filter = document.getElementById("gradeFilter");
            var oldValue = filter.value;
            var grades = [];
            students.forEach(function (student) {
                var grade = String(student.grade);
                if (grade && grades.indexOf(grade) === -1) grades.push(grade);
            });
            grades.sort(function (a, b) { return Number(a) - Number(b); });
            filter.innerHTML = '<option value="">All Grades</option>' + grades.map(function (grade) {
                return '<option value="' + AppAuth.escape(grade) + '">Grade ' + AppAuth.escape(grade) + '</option>';
            }).join("");
            if (grades.indexOf(oldValue) !== -1 || oldValue === "") filter.value = oldValue;
            rebuildingFilter = false;
        }

        function showStudents() {
            var filter = document.getElementById("gradeFilter").value;
            var visible = students.filter(function (student) {
                return filter === "" || String(student.grade) === filter;
            });
            visible = Records.sortBy(visible, sortColumn, sortOrder);
            var view = Records.paginate(visible, page, perPage);
            page = view.page || 1;
            var list = document.getElementById("studentList");
            if (view.rows.length === 0) {
                list.innerHTML = '<tr><td colspan="6" class="empty">No students yet.</td></tr>';
            } else {
                list.innerHTML = view.rows.map(function (student) {
                    return '<tr>' +
                        '<td data-label="Roll No.">' + AppAuth.escape(student.rollNo) + '</td>' +
                        '<td data-label="Name">' + AppAuth.escape(student.name) + '</td>' +
                        '<td data-label="Grade">' + AppAuth.escape(student.grade) + '</td>' +
                        '<td data-label="DOB">' + AppAuth.escape(student.dob) + '</td>' +
                        '<td data-label="Address">' + AppAuth.escape(student.address) + '</td>' +
                        '<td class="actions" data-label="Actions"><span class="action-buttons">' +
                        '<button class="edit" type="button" data-action="edit" data-id="' + AppAuth.escape(student.id) + '">Edit</button>' +
                        '<button class="delete" type="button" data-action="delete" data-id="' + AppAuth.escape(student.id) + '">Delete</button>' +
                        '</span></td></tr>';
                }).join("");
            }
            var pages = document.getElementById("pages");
            pages.innerHTML = "";
            for (var i = 1; i <= view.totalPages; i++) {
                pages.innerHTML += '<button type="button" data-page="' + i + '">' + i + '</button>';
            }
            makeGradeFilter();
        }

        document.getElementById("addStudent").addEventListener("click", function () {
            var name = document.getElementById("studentName").value.trim();
            var grade = document.getElementById("studentGrade").value.trim();
            if (!name || !grade) {
                alert("Please enter the name and grade.");
                return;
            }
            AppAuth.add("students", {
                rollNo: nextRoll(),
                name: name,
                grade: Number(grade),
                dob: document.getElementById("studentDob").value,
                address: document.getElementById("studentAddress").value.trim()
            }).then(function () {
                document.getElementById("studentName").value = "";
                document.getElementById("studentGrade").value = "";
                document.getElementById("studentDob").value = "";
                document.getElementById("studentAddress").value = "";
            }).catch(function (error) { AppAuth.showDataError(error); });
        });

        document.getElementById("studentList").addEventListener("click", function (event) {
            var button = event.target.closest("[data-action]");
            if (!button) return;
            var id = button.getAttribute("data-id");
            var student = students.find(function (row) { return row.id === id; });
            if (!student) return;
            if (button.getAttribute("data-action") === "delete") {
                if (confirm("Delete this student?")) {
                    AppAuth.remove("students", id).catch(function (error) { AppAuth.showDataError(error); });
                }
                return;
            }
            var name = prompt("Enter name:", student.name || "");
            if (name == null) return;
            var grade = prompt("Enter grade:", student.grade == null ? "" : student.grade);
            if (grade == null) return;
            var dob = prompt("Enter DOB:", student.dob || "");
            if (dob == null) return;
            var address = prompt("Enter address:", student.address || "");
            if (address == null) return;
            AppAuth.update("students", id, {
                name: name.trim(),
                grade: Number(grade) || grade,
                dob: dob.trim(),
                address: address.trim()
            }).catch(function (error) { AppAuth.showDataError(error); });
        });

        document.getElementById("exportCsv").addEventListener("click", function () {
            if (students.length === 0) {
                alert("No students to export!");
                return;
            }
            Records.downloadCsv("students.csv", ["Roll No", "Name", "Grade", "DOB", "Address"], students.map(function (student) {
                return [student.rollNo, student.name, student.grade, student.dob, student.address];
            }));
        });
        document.getElementById("gradeFilter").addEventListener("change", function () {
            if (rebuildingFilter) return;
            page = 1;
            showStudents();
        });
        document.querySelector("thead").addEventListener("click", function (event) {
            var header = event.target.closest("[data-sort]");
            if (!header) return;
            var column = header.getAttribute("data-sort");
            if (sortColumn === column) {
                sortOrder = sortOrder === "ASC" ? "DESC" : "ASC";
            } else {
                sortColumn = column;
                sortOrder = "ASC";
            }
            showStudents();
        });
        document.getElementById("pages").addEventListener("click", function (event) {
            var button = event.target.closest("[data-page]");
            if (!button) return;
            page = Number(button.getAttribute("data-page"));
            showStudents();
        });

        AppAuth.start(function () {
            AppAuth.watch("students", function (rows, error) {
                AppAuth.showDataError(error);
                students = rows;
                showStudents();
            });
        });
    </script>
</body>
</html>
