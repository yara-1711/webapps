<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        body { margin: 0; padding: 24px 16px 40px; background: #f4f7ff; font-family: Arial, sans-serif; }
        .box { max-width: 720px; margin: auto; }
        h1 { color: #2456c5; margin-bottom: 8px; }
        p { color: #52607a; }
        .table-box {
            background: white;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 8px 24px rgba(36, 86, 197, 0.12);
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; }
        th { background: #2456c5; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #e6ebf5; }
        @media (max-width: 720px) {
            h1 { font-size: 28px; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase.js"></script>
</head>
<body>
    <div id="appRoot" hidden>
        <div class="box">
            <div class="top-bar">
                <a href="index.html" class="btn btn-soft btn-secondary rounded-full px-6 shadow-md">← Back to My Projects 💗</a>
                <div id="sessionSlot"></div>
            </div>
            <h1>🗄️ Database</h1>
            <p>This page runs a small SQL example in the browser. The student rows below come from that query, and the page stays hidden until you sign in with Google.</p>
            <div class="table-box">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Age</th>
                        </tr>
                    </thead>
                    <tbody id="sqlRows">
                        <tr><td colspan="3">Running the query…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        function renderRows(values) {
            var body = document.getElementById("sqlRows");
            body.innerHTML = values.map(function (row) {
                return "<tr>" +
                    '<td data-label="ID">' + AppAuth.escape(row[0]) + "</td>" +
                    '<td data-label="Name">' + AppAuth.escape(row[1]) + "</td>" +
                    '<td data-label="Age">' + AppAuth.escape(row[2]) + "</td>" +
                    "</tr>";
            }).join("");
        }

        AppAuth.start(function () {
            initSqlJs({
                locateFile: function (file) {
                    return "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/" + file;
                }
            }).then(function (SQL) {
                var db = new SQL.Database();
                db.run("CREATE TABLE students (id INTEGER, name TEXT, age INTEGER);");
                db.run("INSERT INTO students VALUES (1, 'Rhea', 14), (2, 'Aarav', 15);");
                var result = db.exec("SELECT * FROM students");
                console.log(result);
                if (result.length > 0) {
                    renderRows(result[0].values);
                }
            }).catch(function (error) {
                document.getElementById("sqlRows").innerHTML =
                    '<tr><td colspan="3">' + AppAuth.escape(error.message || "Could not start SQL.") + "</td></tr>";
            });
        });
    </script>
</body>
</html>
