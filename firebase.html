<!doctype html>
<html>
  <head>
    <title>Firebase Google Login</title>

    <link
      type="text/css"
      rel="stylesheet"
      href="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.css"
    />
  </head>

  <body>
    <h1>Firebase Google Login</h1>

    <!-- FirebaseUI puts the Google login UI here -->
    <div id="firebaseui-auth-container"></div>

    <!-- User information -->
    <div id="userSection" style="display: none">
      <h2>User Information</h2>

      <p>
        Name:
        <span id="userName"></span>
      </p>

      <p>
        Email:
        <span id="userEmail"></span>
      </p>

      <p>
        User ID:
        <span id="userId"></span>
      </p>

      <button id="logoutButton">Logout</button>
    </div>

    <!-- Firebase App -->
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>

    <!-- Firebase Authentication -->
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>

    <!-- FirebaseUI -->
    <script src="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.js"></script>

    <script>
      // --------------------------------------------------
      // Firebase configuration
      // --------------------------------------------------

      const firebaseConfig = {
        apiKey: "AIzaSyCectC2gNXIYpL8Rt4QeOsQuW5oEF2Tf4k",
        authDomain: "techcoderlabz-project.firebaseapp.com",
        projectId: "techcoderlabz-project",
        storageBucket: "techcoderlabz-project.firebasestorage.app",
        messagingSenderId: "750937809509",
        appId: "1:750937809509:web:b3561297b5d8ea282b5c8c",
        measurementId: "G-J13K9JQ058",
      };

      // --------------------------------------------------
      // Initialize Firebase
      // --------------------------------------------------

      firebase.initializeApp(firebaseConfig);

      // --------------------------------------------------
      // FirebaseUI
      // --------------------------------------------------

      const ui = new firebaseui.auth.AuthUI(firebase.auth());

      const uiConfig = {
        signInOptions: [firebase.auth.GoogleAuthProvider.PROVIDER_ID],

        signInFlow: "popup",

        callbacks: {
          signInSuccessWithAuthResult: function (authResult, redirectUrl) {
            console.log("Login successful:", authResult.user);

            // Stay on this page.
            return false;
          },
        },
      };

      // Start FirebaseUI

      ui.start("#firebaseui-auth-container", uiConfig);

      // --------------------------------------------------
      // Authentication state
      // --------------------------------------------------

      firebase.auth().onAuthStateChanged(function (user) {
        if (user) {
          console.log("User:", user);

          // Hide FirebaseUI

          document.getElementById("firebaseui-auth-container").style.display =
            "none";

          // Show user section

          document.getElementById("userSection").style.display = "block";

          // Display user information

          document.getElementById("userName").innerText =
            user.displayName || "";

          document.getElementById("userEmail").innerText = user.email || "";

          document.getElementById("userId").innerText = user.uid;
        } else {
          // User is not logged in

          document.getElementById("firebaseui-auth-container").style.display =
            "block";

          document.getElementById("userSection").style.display = "none";
        }
      });

      // --------------------------------------------------
      // Logout
      // --------------------------------------------------

      document
        .getElementById("logoutButton")
        .addEventListener("click", function () {
          firebase.auth().signOut();
        });
    </script>
  </body>
</html>
