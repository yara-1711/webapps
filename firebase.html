<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Google Login</title>
    <link rel="stylesheet" href="css/auth.css">
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f6f3ff; color: #3f3b4d; }
        .box { max-width: 560px; margin: auto; padding: 28px 16px 40px; }
        .card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 25px rgba(99, 83, 155, 0.12);
        }
        a { color: #7564b5; font-weight: bold; }
        dt { font-size: 13px; color: #817b91; margin-top: 12px; }
        dd { margin: 4px 0 0; word-break: break-all; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase.js"></script>
</head>
<body>
    <div id="appRoot" hidden>
        <div class="box">
            <div class="top-bar">
                <a href="index.html">← All projects</a>
                <div id="sessionSlot"></div>
            </div>
            <div class="card">
                <h1>Signed in</h1>
                <p>This account is the same Google sign-in used by every project. Lists are stored in Firestore for this user.</p>
                <dl>
                    <dt>Name</dt>
                    <dd id="userName"></dd>
                    <dt>Email</dt>
                    <dd id="userEmail"></dd>
                    <dt>User ID</dt>
                    <dd id="userId"></dd>
                </dl>
            </div>
        </div>
    </div>
    <script>
        AppAuth.start(function (user) {
            document.getElementById("userName").textContent = user.displayName || "";
            document.getElementById("userEmail").textContent = user.email || "";
            document.getElementById("userId").textContent = user.uid;
        });
    </script>
</body>
</html>
