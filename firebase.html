<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link type="text/css" rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.css" />

    <script>
        function onClickOfAButton() {
            document.getElementById("hideMe").hidden = true;
            document.getElementById("showMe").hidden = false;
        }
    </script>
</head>

<body>
    <div id="firebaseui-auth-container"></div>
    <div id="userSection" style="display: none">
        <h2>Welcome!</h2>
        <p>Name: <span id="userName"></span></p>
        <p>Email: <span id="userEmail"></span></p>
        <p>User ID: <span id="userId"></span></p>
        <p>Photo URL: <span id="userPhoto"></span></p>
        <button id="logoutButton">Logout</button>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>

    <!-- Firebase Authentication -->
    <script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-auth-compat.js"></script>

    <!-- FirebaseUI -->
    <script src="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            signOut,
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
        const firebaseConfig = {
            apiKey: "AIzaSyCectC2gNXIYpL8Rt4QeOsQuW5oEF2Tf4k",
            authDomain: "techcoderlabz-project.firebaseapp.com",
            projectId: "techcoderlabz-project",
            storageBucket: "techcoderlabz-project.firebasestorage.app",
            messagingSenderId: "750937809509",
            appId: "1:750937809509:web:b3561297b5d8ea282b5c8c",
            measurementId: "G-J13K9JQ058",
        };
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        // FirebaseUI
        const ui = new firebaseui.auth.AuthUI(auth);
        // FirebaseUI configuration
        const uiConfig = {
            signInOptions: [firebase.auth.GoogleAuthProvider.PROVIDER_ID],
            signInFlow: "popup",
            signInSuccessWithAuthResult: function (authResult, redirectUrl) { console.log("Logged in:", authResult.user); return false; }
        };
        // Start FirebaseUI 
        ui.start("#firebaseui-auth-container", uiConfig);

        // Authentication state

        firebase.auth().onAuthStateChanged(function (user) {

            if (user) {

                // Logged in

                document
                    .getElementById("firebaseui-auth-container")
                    .style.display = "none";

                document
                    .getElementById("userSection")
                    .style.display = "block";


                // Show user information

                document.getElementById("userName").innerText =
                    user.displayName || "";

                document.getElementById("userEmail").innerText =
                    user.email || "";

                document.getElementById("userId").innerText =
                    user.uid;

            }

            else {

                // Not logged in

                document
                    .getElementById("firebaseui-auth-container")
                    .style.display = "block";

                document
                    .getElementById("userSection").style.display = "none";

            }

        });


        // Logout

        document
            .getElementById("logoutButton")
            .addEventListener("click", function () {

                firebase.auth().signOut();

            });
    </script>
</body>

</html>
